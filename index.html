<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الألعاب</title>
<style>
  :root {
    --bg-primary: #0a0610;
    --bg-card: #140f1a;
    --accent-red: #ff1f3d;
    --accent-red-glow: rgba(255, 31, 61, 0.55);
    --accent-emerald: #00ff9d;
    --accent-emerald-glow: rgba(0, 255, 157, 0.5);
    --accent-gold: #d4af37;
    --accent-gold-soft: rgba(212, 175, 55, 0.35);
    --gta-pink: #ff2d95;
    --gta-purple: #8a2be2;
    --gta-cyan: #00e5ff;
    --text-main: #ece6f0;
    --text-muted: #9a8fa6;
    --border-soft: #2a1f33;
    --gray-gold: linear-gradient(135deg, #6b6b6b, #d4af37 60%, #8a8a8a);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255, 45, 149, 0.18), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(138, 43, 226, 0.16), transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(0, 229, 255, 0.12), transparent 45%),
      radial-gradient(circle at 20% 85%, rgba(0, 255, 157, 0.08), transparent 40%),
      linear-gradient(180deg, #0a0610 0%, #120a1a 50%, #0a0610 100%);
  }

  /* ===== Splash Screen ===== */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    background:
      radial-gradient(circle at 30% 30%, rgba(255, 45, 149, 0.25), transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(0, 229, 255, 0.22), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.18), transparent 60%),
      #050308;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  #splash.hide { opacity: 0; visibility: hidden; }
  #splash .splash-title {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900; letter-spacing: 2px; line-height: 1.3;
    background: linear-gradient(90deg, var(--gta-pink), var(--gta-purple), var(--gta-cyan), var(--accent-emerald));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: splashShift 5s linear infinite, splashPulse 2.2s ease-in-out infinite;
    filter: drop-shadow(0 0 28px rgba(255, 45, 149, 0.55));
    padding: 0 20px;
  }
  #splash .splash-sub { margin-top: 18px; color: var(--text-muted); font-size: 0.95rem; letter-spacing: 1px; }
  #enterBtn {
    margin-top: 38px; padding: 16px 46px;
    font-family: inherit; font-size: 1.15rem; font-weight: 800; letter-spacing: 1px;
    color: #0a0610;
    background: linear-gradient(135deg, var(--gta-pink), var(--accent-gold), var(--gta-cyan));
    background-size: 220% 220%;
    border: none; border-radius: 50px; cursor: pointer;
    animation: splashShift 3s linear infinite, enterGlow 1.8s ease-in-out infinite;
    transition: transform 0.25s ease;
  }
  #enterBtn:hover { transform: scale(1.06); }
  #enterBtn:active { transform: scale(0.97); }
  @keyframes splashShift { 0%{background-position:0% 50%} 100%{background-position:300% 50%} }
  @keyframes splashPulse {
    0%,100% { filter: drop-shadow(0 0 22px rgba(255,45,149,0.45)); }
    50% { filter: drop-shadow(0 0 38px rgba(0,229,255,0.65)); }
  }
  @keyframes enterGlow {
    0%,100% { box-shadow: 0 0 22px rgba(255,45,149,0.55), 0 0 40px rgba(0,229,255,0.25); }
    50% { box-shadow: 0 0 34px rgba(212,175,55,0.75), 0 0 60px rgba(138,43,226,0.35); }
  }

  /* ===== Header ===== */
  header {
    text-align: center; padding: 42px 20px 18px;
    border-bottom: 1px solid var(--border-soft); position: relative;
  }
  header::after {
    content: ""; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gta-pink), var(--accent-gold), transparent);
    box-shadow: 0 0 14px rgba(255,45,149,0.5);
  }
  header h1 {
    font-size: 2.4rem; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent-red), var(--gta-pink), var(--gta-cyan), var(--accent-emerald));
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: splashShift 6s linear infinite;
    filter: drop-shadow(0 0 18px var(--accent-red-glow));
  }
  header p { color: var(--text-muted); margin-top: 10px; font-size: 0.9rem; letter-spacing: 0.5px; }

  /* ===== شريط الأقسام ===== */
  .sections-nav {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; padding: 22px 16px;
    position: sticky; top: 0; z-index: 10;
    background: rgba(10, 6, 16, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-soft);
  }
  .sections-nav button {
    font-family: inherit; font-size: 0.9rem; color: var(--text-main);
    background: transparent; padding: 9px 20px;
    border: 1px solid var(--border-soft); border-radius: 22px;
    cursor: pointer; transition: all 0.25s ease; position: relative;
  }
  .sections-nav button:hover {
    border-color: var(--gta-cyan); color: var(--gta-cyan);
    box-shadow: 0 0 14px rgba(0,229,255,0.4);
  }
  .sections-nav button.active {
    color: #0a0610; font-weight: 700;
    background: linear-gradient(135deg, var(--gta-pink), var(--gta-purple));
    border-color: var(--gta-pink);
    box-shadow: 0 0 18px rgba(255,45,149,0.55), 0 0 4px var(--accent-gold-soft);
  }
  .sections-nav button.active::after {
    content: ""; position: absolute; inset: -3px; border-radius: 24px;
    border: 1px solid var(--accent-gold-soft); pointer-events: none;
  }

  .current-section-title {
    text-align: center; padding: 26px 20px 6px;
    font-size: 1.4rem; color: var(--gta-pink);
    text-shadow: 0 0 16px rgba(255,45,149,0.55); letter-spacing: 0.5px;
  }
  .current-section-title span {
    display: inline-block; padding-bottom: 8px;
    border-bottom: 2px solid var(--accent-gold);
    box-shadow: 0 6px 12px -8px var(--accent-gold-soft);
  }

  /* ===== شبكة الألعاب ===== */
  .games-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px; padding: 24px 40px 60px;
    max-width: 1300px; margin: 0 auto;
  }
  .game-card {
    background: var(--bg-card); border: 1px solid var(--border-soft);
    border-radius: 14px; padding: 18px; transition: all 0.3s ease;
    position: relative; overflow: hidden;
  }
  .game-card::before {
    content: ""; position: absolute; top: 0; right: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--gta-pink), transparent);
    opacity: 0.6; transition: opacity 0.3s;
  }
  .game-card:hover {
    transform: translateY(-4px); border-color: var(--gta-pink);
    box-shadow: 0 8px 26px rgba(255,45,149,0.3);
  }
  .game-card:hover::before { opacity: 1; }

  /* حالة "محمّلة" — رمادي مخلوط بذهبي */
  .game-card.downloaded {
    background: linear-gradient(135deg, #1a1a1a 0%, #2b2620 40%, #1f1d18 70%, #151515 100%);
    border-color: var(--accent-gold);
    box-shadow: 0 0 18px rgba(212,175,55,0.45), 0 0 40px rgba(107,107,107,0.15);
  }
  .game-card.downloaded::before {
    background: linear-gradient(180deg, var(--accent-gold), #6b6b6b, transparent);
  }
  .game-card.downloaded .game-title {
    color: var(--accent-gold); text-shadow: 0 0 10px rgba(212,175,55,0.6);
  }
  .game-card.downloaded::after {
    content: "✓ محمّلة"; position: absolute; top: 10px; left: 10px;
    background: var(--gray-gold); color: #0a0610;
    font-size: 0.68rem; font-weight: 800;
    padding: 3px 10px; border-radius: 10px;
    box-shadow: 0 0 12px rgba(212,175,55,0.7);
  }

  .game-title { font-size: 1rem; margin-bottom: 12px; line-height: 1.5; font-weight: 600; }
  .game-card a {
    display: inline-block; margin-top: 6px;
    color: var(--gta-cyan); text-decoration: none;
    font-size: 0.85rem; font-weight: 600; transition: all 0.25s;
  }
  .game-card a:hover { color: var(--gta-pink); text-shadow: 0 0 10px rgba(255,45,149,0.55); }

  .download-btn {
    display: block; width: 100%; margin-top: 14px;
    padding: 9px 14px; font-family: inherit;
    font-size: 0.82rem; font-weight: 700; letter-spacing: 0.4px;
    color: var(--text-main); background: transparent;
    border: 1px solid var(--border-soft); border-radius: 10px;
    cursor: pointer; transition: all 0.25s ease;
  }
  .download-btn:hover {
    border-color: var(--gta-pink); color: var(--gta-pink);
    box-shadow: 0 0 14px rgba(255,45,149,0.35);
  }
  .game-card.downloaded .download-btn {
    background: var(--gray-gold); color: #0a0610;
    border-color: transparent; box-shadow: 0 0 14px rgba(212,175,55,0.5);
  }
  .game-card.downloaded .download-btn:hover { filter: brightness(1.12); }

  .loading, .error, .empty {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted); font-size: 1rem;
  }
  footer {
    text-align: center; padding: 28px; color: var(--text-muted);
    font-size: 0.78rem; border-top: 1px solid var(--border-soft);
  }

  /* ===== زرار الموسيقى ===== */
  #musicToggle {
    position: fixed; bottom: 26px; left: 26px; z-index: 500;
    width: 62px; height: 62px; border-radius: 50%; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(135deg, #2a1f33, #0a0610 70%);
    box-shadow:
      0 0 0 1px rgba(212,175,55,0.35),
      0 8px 24px rgba(0,0,0,0.6),
      inset 0 0 18px rgba(255,45,149,0.25);
    transition: transform 0.25s ease, box-shadow 0.3s ease;
  }
  #musicToggle:hover {
    transform: scale(1.08);
    box-shadow:
      0 0 0 1px rgba(212,175,55,0.7),
      0 10px 30px rgba(0,0,0,0.7),
      inset 0 0 24px rgba(255,45,149,0.45),
      0 0 24px rgba(255,45,149,0.35);
  }
  #musicToggle::before {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 1px solid rgba(0,229,255,0.35);
    animation: ringPulse 2.4s ease-out infinite; pointer-events: none;
  }
  #musicToggle.playing::before {
    border-color: rgba(0,255,157,0.6); animation-duration: 1.4s;
  }
  @keyframes ringPulse {
    0% { transform: scale(0.9); opacity: 0.9; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  .music-bars { display: flex; align-items: flex-end; gap: 4px; height: 26px; }
  .music-bars span {
    display: block; width: 4px; border-radius: 2px;
    background: linear-gradient(180deg, var(--accent-gold), var(--gta-pink));
    box-shadow: 0 0 8px rgba(255,45,149,0.6);
    height: 8px; transition: height 0.3s;
  }
  #musicToggle.playing .music-bars span { animation: barDance 0.9s ease-in-out infinite; }
  #musicToggle.playing .music-bars span:nth-child(1) { animation-delay: 0s; }
  #musicToggle.playing .music-bars span:nth-child(2) { animation-delay: 0.15s; }
  #musicToggle.playing .music-bars span:nth-child(3) { animation-delay: 0.3s; }
  #musicToggle.playing .music-bars span:nth-child(4) { animation-delay: 0.45s; }
  @keyframes barDance { 0%,100% { height: 7px; } 50% { height: 24px; } }
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <div class="splash-title">ادخل عالم الألعاب والموسيقى</div>
  <div class="splash-sub">اضغط للدخول وتشغيل الموسيقى</div>
  <button id="enterBtn">🎮 دخول 🎵</button>
</div>

<!-- زرار الموسيقى -->
<button id="musicToggle" title="تشغيل/إيقاف الموسيقى">
  <div class="music-bars">
    <span></span><span></span><span></span><span></span>
  </div>
</button>
<audio id="bgMusic" loop preload="auto">
  <source src="theme.mp3" type="audio/mpeg">
</audio>

<header>
  <h1 id="siteTitle">🎮 مكتبة الألعاب</h1>
  <p id="siteSubtitle">اختر قسمًا لعرض ألعابه</p>
</header>

<nav class="sections-nav" id="sectionsNav"></nav>

<h2 class="current-section-title" id="currentTitle" style="display:none;">
  <span id="currentTitleText"></span>
</h2>

<main id="mainContent">
  <div class="loading">جاري تحميل الألعاب...</div>
</main>

<footer id="siteFooter">© 2025 مكتبة الألعاب — جميع الحقوق محفوظة</footer>

<script>
/* ===== الموسيقى ===== */
const music = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicToggle');

function setMusicUI(playing) {
  musicBtn.classList.toggle('playing', playing);
  musicBtn.title = playing ? 'إيقاف الموسيقى' : 'تشغيل الموسيقى';
}
musicBtn.addEventListener('click', () => {
  if (music.paused) {
    music.play().then(() => setMusicUI(true)).catch(() => setMusicUI(false));
  } else {
    music.pause();
    setMusicUI(false);
  }
});
music.addEventListener('play', () => setMusicUI(true));
music.addEventListener('pause', () => setMusicUI(false));

/* ===== Splash ===== */
const splash = document.getElementById('splash');
const enterBtn = document.getElementById('enterBtn');
enterBtn.addEventListener('click', () => {
  splash.classList.add('hide');
  music.play().then(() => setMusicUI(true)).catch(() => setMusicUI(false));
  setTimeout(() => { splash.style.display = 'none'; }, 950);
});

/* ===== الألعاب + الإعدادات ===== */
(async function () {
  const main = document.getElementById('mainContent');
  const nav = document.getElementById('sectionsNav');
  const currentTitle = document.getElementById('currentTitle');
  const currentTitleText = document.getElementById('currentTitleText');
  const siteTitle = document.getElementById('siteTitle');
  const siteSubtitle = document.getElementById('siteSubtitle');
  const siteFooter = document.getElementById('siteFooter');

  let data = null;

  function applySettings(s) {
    if (!s) return;
    const root = document.documentElement;
    if (s.accentRed)     root.style.setProperty('--accent-red', s.accentRed);
    if (s.accentEmerald) root.style.setProperty('--accent-emerald', s.accentEmerald);
    if (s.accentGold)    root.style.setProperty('--accent-gold', s.accentGold);
    if (s.gtaPink)       root.style.setProperty('--gta-pink', s.gtaPink);
    if (s.gtaPurple)     root.style.setProperty('--gta-purple', s.gtaPurple);
    if (s.gtaCyan)       root.style.setProperty('--gta-cyan', s.gtaCyan);
    if (s.fontFamily)    document.body.style.fontFamily = s.fontFamily;
    if (s.fontSize)      root.style.fontSize = s.fontSize + 'px';
    if (s.siteName) {
      siteTitle.textContent = '🎮 ' + s.siteName;
      document.title = s.siteName;
      siteFooter.textContent = '© 2025 ' + s.siteName + ' — جميع الحقوق محفوظة';
    }
    if (s.siteSubtitle) siteSubtitle.textContent = s.siteSubtitle;
  }

  function renderSection(section) {
    [...nav.children].forEach(btn => {
      btn.classList.toggle('active', btn.dataset.section === section);
    });
    currentTitle.style.display = 'block';
    currentTitleText.textContent = section;
    const games = data.games.filter(g => g.section === section);
    if (!games.length) {
      main.innerHTML = '<div class="empty">لا توجد ألعاب في هذا القسم بعد.</div>';
      return;
    }
    main.innerHTML = `
      <div class="games-grid">
        ${games.map(g => `
          <div class="game-card ${g.downloaded ? 'downloaded' : ''}" data-id="${g.id}">
            <div class="game-title">${g.title}</div>
            <a href="${g.url}" target="_blank" rel="noopener">فتح الرابط ↗</a>
            <button class="download-btn">${g.downloaded ? '✓ محمّلة' : 'حمّلتها'}</button>
          </div>
        `).join('')}
      </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  main.addEventListener('click', (e) => {
    const btn = e.target.closest('.download-btn');
    if (!btn) return;
    const card = btn.closest('.game-card');
    const id = card.dataset.id;
    const game = data.games.find(g => g.id === id);
    if (!game) return;
    game.downloaded = !game.downloaded;
    card.classList.toggle('downloaded', game.downloaded);
    btn.textContent = game.downloaded ? '✓ محمّلة' : 'حمّلتها';
    try { localStorage.setItem('downloaded_' + id, game.downloaded ? '1' : '0'); } catch (_) {}
  });

  try {
    const res = await fetch('games.json?t=' + Date.now());
    data = await res.json();
    if (!data.games || !data.games.length) {
      main.innerHTML = '<div class="empty">لا توجد ألعاب بعد.</div>';
      return;
    }
    // تطبيق إعدادات الموقع
    applySettings(data.settings);

    // استرجاع حالة التحميل المحفوظة محليًا
    data.games.forEach(g => {
      try {
        const v = localStorage.getItem('downloaded_' + g.id);
        if (v === '1') g.downloaded = true;
      } catch (_) {}
    });

    nav.innerHTML = data.sections.map(s =>
      `<button data-section="${s}">${s}</button>`
    ).join('');
    nav.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (btn) renderSection(btn.dataset.section);
    });
    renderSection(data.sections[0]);
  } catch (e) {
    main.innerHTML = '<div class="error">حدث خطأ في تحميل البيانات.</div>';
  }
})();
</script>
</body>
</html>
